<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Outline and Focus Form</title><link rel="stylesheet" href="question-9.css"></head>
<body><main class="form-page"><section class="intro"><p class="kicker">CSS laboratory / 09</p><h1>Leave a clear note.</h1><p>A small form with friendly focus states and a little room to think.</p></section><form class="note-form"><label for="name">Your name</label><input id="name" type="text" placeholder="e.g. Samira Khan"><label for="email">Email address</label><input id="email" type="email" placeholder="samira@example.com"><label for="message">Your message</label><textarea id="message" rows="5" placeholder="Write a few lines..."></textarea><button type="submit">Send message <span>-></span></button></form></main><footer>Fields are designed to show where you are.</footer></body></html>
