<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Atelier</title><link rel="stylesheet" href="question-7.css"></head><body><main class="contact-layout"><section class="contact-intro"><p class="eyebrow">CONTACT ATELIER</p><h1>Let’s make something meaningful.</h1><p>Tell us a little about your idea, and we’ll get back to you within two working days.</p></section><form action="#" method="post"><div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text"></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea></div><button type="submit">Send message</button></form></main></body></html>
