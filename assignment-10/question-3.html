<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Goods | Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="question-3.css">
</head>
<body>
  <header class="catalog-header"><div class="container py-4 d-flex justify-content-between align-items-center"><a class="brand" href="#catalog">MARKET / GOODS</a><a class="cart-link" href="#catalog">Bag <span>0</span></a></div></header>
  <main class="container py-5" id="catalog">
    <section><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><p class="eyebrow">Made for everyday rituals</p><h1>Objects with a purpose.</h1></div><p class="catalog-note mb-1">Thoughtful goods, sourced with care.</p></div>
      <!-- col-12, col-sm-6, and col-md-3 give one, two, and four columns by screen size. -->
      <div class="row g-4 product-grid">
        <div class="col-12 col-sm-6 col-md-3"><article class="product-card shadow-sm"><img src="https://images.unsplash.com/photo-1490312278390-ab64016e0aa9?auto=format&amp;fit=crop&amp;w=700&amp;q=85" class="img-fluid" alt="Handmade ceramic mug on a table"><div class="product-info"><p class="product-kind">CERAMICS</p><h2>Daybreak mug</h2><div class="d-flex justify-content-between align-items-center"><span>$32</span><button class="btn btn-sm btn-outline-dark" type="button">Add to Cart</button></div></div></article></div>
        <div class="col-12 col-sm-6 col-md-3"><article class="product-card shadow-sm"><img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&amp;fit=crop&amp;w=700&amp;q=85" class="img-fluid" alt="Minimal desk lamp beside books"><div class="product-info"><p class="product-kind">LIGHTING</p><h2>Arc table light</h2><div class="d-flex justify-content-between align-items-center"><span>$86</span><button class="btn btn-sm btn-outline-dark" type="button">Add to Cart</button></div></div></article></div>
        <div class="col-12 col-sm-6 col-md-3"><article class="product-card shadow-sm"><img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&amp;fit=crop&amp;w=700&amp;q=85" class="img-fluid" alt="Reusable bottle ready for a day out"><div class="product-info"><p class="product-kind">OUTDOORS</p><h2>Field bottle</h2><div class="d-flex justify-content-between align-items-center"><span>$28</span><button class="btn btn-sm btn-outline-dark" type="button">Add to Cart</button></div></div></article></div>
        <div class="col-12 col-sm-6 col-md-3"><article class="product-card shadow-sm"><img src="https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&amp;fit=crop&amp;w=700&amp;q=85" class="img-fluid" alt="Wooden chair in a bright room"><div class="product-info"><p class="product-kind">HOME</p><h2>Studio chair</h2><div class="d-flex justify-content-between align-items-center"><span>$240</span><button class="btn btn-sm btn-outline-dark" type="button">Add to Cart</button></div></div></article></div>
      </div>
    </section>
  </main>
  <footer class="container py-4">Market / Goods <span>Good things, made to last.</span></footer>
</body>
</html>
