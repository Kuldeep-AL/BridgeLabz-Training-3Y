<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Gallery | Assignment 9</title>
  <link rel="stylesheet" href="question-1.css">
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Assignment 09 / 01</p>
    <h1>Light, filtered</h1>
    <p>One collection, six different ways of seeing it.</p>
  </header>
  <main>
    <section class="gallery" aria-label="CSS image filter gallery">
      <figure><img class="blur" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=800&amp;q=85" alt="Mountain lake beneath a cloudy sky"><figcaption><strong>Soft focus</strong><span>Blur</span></figcaption></figure>
      <figure><img class="grayscale" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=800&amp;q=85" alt="Sunrise spilling over a misty landscape"><figcaption><strong>Quiet tones</strong><span>Grayscale</span></figcaption></figure>
      <figure><img class="sepia" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=800&amp;q=85" alt="Open countryside under a bright sky"><figcaption><strong>Old-world warmth</strong><span>Sepia</span></figcaption></figure>
      <figure><img class="brightness" src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&amp;fit=crop&amp;w=800&amp;q=85" alt="Green meadow and distant mountains"><figcaption><strong>Brightened</strong><span>Brightness</span></figcaption></figure>
      <figure><img class="contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=800&amp;q=85" alt="Rugged mountain peaks in daylight"><figcaption><strong>High definition</strong><span>Contrast</span></figcaption></figure>
      <figure><img class="hue" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=800&amp;q=85" alt="Lake reflecting the surrounding mountains"><figcaption><strong>Color shift</strong><span>Hue rotate</span></figcaption></figure>
    </section>
  </main>
  <footer>CSS filters / image study</footer>
</body>
</html>
