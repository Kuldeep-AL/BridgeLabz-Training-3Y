<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>
    <h1>Map of Pune</h1>
    <!-- loading="lazy" waits to load the map until it is close to the visible area. -->
    <iframe src="https://www.google.com/maps?q=Pune%2C%20India&amp;output=embed" title="Map showing Pune, India" width="600" height="450" loading="lazy"></iframe>
</body>
</html>
