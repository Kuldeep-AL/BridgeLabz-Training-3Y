<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form and Result</title>
</head>
<body>
    <h1>Submit a Form</h1>
    <form action="result.html" method="get" target="result-frame">
        <label for="message">Message:</label>
        <input type="text" id="message" name="message">
        <button type="submit">Submit</button>
    </form>
    <iframe src="about:blank" name="result-frame" title="Form result" width="80%" height="100"></iframe>
</body>
</html>
